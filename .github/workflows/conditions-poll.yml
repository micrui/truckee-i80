name: conditions-poll
on:
  schedule:
    - cron: "*/30 * * 11,12,1,2,3,4 *"   # every 30 min, November-April
    - cron: "0 */3 * 5,6,7,8,9,10 *"     # every 3 hours, May-October
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Poll chain control and closures
        run: python3 conditions_poll.py
          python3 render_site.py
      - name: Commit changes
        run: |
          git config user.name "truckee-i80 conditions poller"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.html data/conditions
          git pull --rebase --autostash -q || true
          git diff --cached --quiet || git commit -m "Conditions: $(date -u '+%F %H:%M')"
          git push
