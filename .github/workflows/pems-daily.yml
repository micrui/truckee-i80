name: pems-daily
on:
  schedule:
    - cron: "0 19 * * *"   # daily, after PeMS posts the prior day's file
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull and aggregate yesterday
        env:
          PEMS_USER: ${{ secrets.PEMS_USER }}
          PEMS_PASS: ${{ secrets.PEMS_PASS }}
        run: python3 pems_daily.py
      - name: Commit
        run: |
          git config user.name "truckee-i80 daily job"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pems
          git pull --rebase --autostash -q || true
          git diff --cached --quiet || git commit -m "PeMS daily: $(date -u +%F)"
          git push
